
<app-loader [isLoading]="loading"></app-loader>
<div *ngIf="!loading">
<div class="container-fluid pt-5">
  <mat-chip-set>
    <mat-chip style="cursor: pointer; color: teal;" (click)="userNoSearchItem('smartwatches')">
      <img matChipAvatar class="chips-img" src="./assets/img/watch1.png" alt="Photo of a Shiba Inu" />
      Watches</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('smartphones')">
      <img matChipAvatar class="chips-img" src="./assets/img/color-mobile.jpg" alt="Photo of a Shiba Inu" />
      Mobiles</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('shoes')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/shoes-red3.webp" alt="Photo of a Shiba Inu" />
      Shoes</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('tshirts')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/tshirt3.webp" alt="Photo of a Shiba Inu" />
      Clothes</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('saree')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/red_image.jpg" alt="Photo of a Shiba Inu" />
      Saree</mat-chip>
      <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('kids wear')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/newbornbaby.webp" alt="Photo of a Shiba Inu" />
      Kids</mat-chip>
      <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('belts')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/belts2.webp" alt="Photo of a Shiba Inu" />
      Belts</mat-chip>
      <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('sandals')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/men-sandals-gray.webp" alt="Photo of a Shiba Inu" />
      Sandals</mat-chip>
      <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('earrings')">
      <img matChipAvatar class="chips-img" src="./assets/uploads/earing-blue4.webp" alt="Photo of a Shiba Inu" />
      Jwellery</mat-chip>

  </mat-chip-set>
  <div>
    <div id="carouselExampleControls1" class="carousel slide" data-ride="carousel">
      <div class="carousel-inner" (click)="onClickImage('sandals')">
        <div class="carousel-item" *ngFor="let image of sliderImage1; let i = index" [class.active]="i === 0">
          <img class="d-block w-100" [src]="image | replacePath:'new-ruralx/src':'..'" alt="Slide {{ i + 1 }}" />
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselExampleControls1" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleControls1" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
    <div class="product-grid-container">
      <div class="row justify-content-flex-start">

        <!-- Card 1 -->
        <div class="product-card col-lg-3 col-md-4 col-sm-6 col-12 mb-2">
          <div class="card shadow-sm h-100">
            <div *ngFor="let imgName of productName let i = index">
              <div class="product-name-content" *ngIf="i === 0">{{ imgName }}</div>
            </div>

            <div class="row g-2" style="padding-left: 15px; padding-right: 15px;">

              <div class="col-6 d-flex align-items-center justify-content-center slider-img"
                *ngFor="let image of sliderImage4; let i = index">

                <ng-container *ngIf="i < 4">
                  <img class="img-fluid p-1" [src]="image | replacePath:'new-ruralx/src':'..'" alt="Image {{ i + 1 }}"
                    style="width: 100%; object-fit: cover; border-radius: 8px;cursor: pointer;"
                    (click)="onClickImage('saree')" />
                </ng-container>
              </div>
            </div>
          </div>
        </div>
