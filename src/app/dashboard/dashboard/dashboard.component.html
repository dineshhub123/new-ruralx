<app-loader [isLoading]="loading"></app-loader>
<div *ngIf="!loading">
  <div class="category-scroll" [class.at-top]="showHeaderAtTop">
    <div class="category-item" *ngFor="let chip of chipsList" (click)="onClickImage(chip.category)">
      <img class="chips-img" [src]="imageBaseUrl + chip.image[0]" [alt]="chip.category" />
      <span>{{ chip.category | titlecase }}</span>
    </div>
  </div>

  <div class="container-fluid pt-5">
    <div>
       <div *ngFor="let data of carouselData; let i = index" class="mb-1">
        <div id="{{data.category}}Carousel" class="carousel slide" data-ride="carousel">
          <div class="carousel-inner" (click)="onClickImage(data.category)">
            <div class="carousel-item" *ngFor="let image of data.images; let j = index" [class.active]="j === 0">
              <img class="d-block w-100 carousel-img" [src]="imageBaseUrl + image"
                alt="{{ data.category }} Slide {{ j + 1 }}" />
            </div>
          </div>
          <a class="carousel-control-prev" href="#{{data.category}}Carousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </a>
          <a class="carousel-control-next" href="#{{data.category}}Carousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </a>
        </div>
      </div> 

      <!-- Dynamic Card Sub Category Wise  -->
      <div class="product-grid-container">
        <div class="row justify-content-flex-start">
          <div class="product-card col-lg-3 col-md-4 col-sm-6 col-12 mb-2"
            *ngFor="let subcategory of cardSubCategoryList">
            <div class="card shadow-sm h-100">
               <div class="product-name-content">
                {{ categoryData[subcategory]?.name }}
              </div>
              <div class="row g-3 px-3">
                <div class="col-6 col-md-6" *ngFor="let p of categoryData[subcategory]?.products">
                  <div class="product-card">
                    <img class="img-fluid product-img" [src]="imageBaseUrl + p.image" alt="Image"
                      (click)="onClickImage(subcategory)" />
                    <div class="product-info">
                      <div class="price">
                        ₹ {{p.price}}
                        <del class="mrp">{{p.mrp}}</del>
                        <span class="discount">{{p.discount }} off</span>
                      </div>
                      <div class="delivery">Free Delivery</div>
                    </div>
                  </div>
                </div>
              </div> 
            </div>
          </div>
        </div>
      </div>
    </div>
    <br>
    <small class="web-link pt-1">
      Discover more on RuralX : <a href="https://www.ruralx.in" target="_blank" class="ml-1">www.ruralx.in</a>
    </small>
    <br>
    <br>
  </div>
</div>
