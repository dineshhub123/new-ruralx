<div class="container-fluid pt-5">
  <mat-chip-set>
    <mat-chip style="cursor: pointer; color: teal;" (click)="userNoSearchItem('bestseller')">
      <img matChipAvatar class="chips-img" src="./assets/img/watch2.png" alt="Photo of a Shiba Inu" />
      Best Seller</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('mobile')">
      <img matChipAvatar class="chips-img" src="./assets/img/color-mobile.jpg" alt="Photo of a Shiba Inu" />
      Mobiles</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('new release')">
      <img matChipAvatar class="chips-img" src="./assets/img/shoes.jpg" alt="Photo of a Shiba Inu" />
      New Release</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('electronic')">
      <img matChipAvatar class="chips-img" src="./assets/img/electronics_component.jpg" alt="Photo of a Shiba Inu" />
      Electronics</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('cloth')">
      <img matChipAvatar class="chips-img" src="./assets/img/saree.png" alt="Photo of a Shiba Inu" />
      Clothes</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('grocery')">
      <img matChipAvatar class="chips-img" src="./assets/img/grocery.png" alt="Photo of a Grocery" />
      Grocery</mat-chip>
    <mat-chip style="cursor: pointer;color: teal;" (click)="userNoSearchItem('fashion')">
      <img matChipAvatar class="chips-img" src="./assets/img/fashion.png" alt="Photo of a Shiba Inu" />
      Fashion</mat-chip>
    <!-- <mat-chip style="cursor: pointer; color: teal;"(click)="customerServiceFunc('customer')">
      Costomer Service</mat-chip> -->
  </mat-chip-set>
  <div>
    <div id="carouselExampleControls1" class="carousel slide" data-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item" *ngFor="let image of sliderImage1; let i = index" [class.active]="i === 0">
          <img class="d-block w-100" [src]="image | replacePath:'new-ruralx/src':'..'"
           alt="Slide {{ i + 1 }}" />
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselExampleControls1" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselExampleControls1" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
