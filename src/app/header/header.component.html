<div class="headerPositionFixed" [class.at-top]="showHeaderAtTop">
  <nav class="navbar navbar-menu">
    <div class="input-text-and-btn">
      <form #searchData="ngForm" (ngSubmit)="searchDataFn(myControl.value)">
        <div class="navbar-input_btn ">
          <div class="setwidth">
            <input type="text" placeholder="Type to search products" aria-label="Number" matInput
              [formControl]="myControl" [matAutocomplete]="auto" #searchValue (keyup)="searchDataFn(myControl.value)">
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                {{option}}
              </mat-option>
            </mat-autocomplete>
          <button type="submit" mat-flat-button class="" style="border-radius:0px ;">
              <mat-icon>search</mat-icon>
              </button>
          </div>
        
        </div>
      </form>  
    </div>
  </nav>
  <div class="location-content" [class.at-top]="showHeaderAtTop" *ngIf="showUsername">
    <mat-icon class="locatin-icon-align">location_on</mat-icon>
    <span class="location-text">{{deliverText | titlecase}}</span>
    <button type="button" class="location-change" (click)="openBottomSheet()" aria-label="Change delivery location">
      <span>Change</span>
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>
</div>
