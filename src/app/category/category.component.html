<app-loader [isLoading]="isLoading"></app-loader>
<div *ngIf="!isLoading">
  <div class="categories-page pt-3">
    <!-- Sidebar -->
    <div class="sidebar pt-4 mt-1 " (scroll)="onContentScroll($event)">
      <!-- <h3>Categories</h3> -->
      <ul>
        <li #catText *ngFor="let cat of uniqueCategories" class="cat-name"
          (click)="onSelectCategory(cat?.category,catText.innerText)"
          [class.selected]="selectedCategory === cat?.category">
          <label class="category-title" [class.selected]="selectedCategory === cat?.category"> {{ formatCategoryName(cat?.category)}} </label>
          <ul>
            <li class="sub-card" [class.selected]="selectedCategory === cat?.category">
              <img [src]="'assets/img/' + cat?.category + '-menu.png'" [alt]="cat?.category" class="category-thumb">
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <!-- Main Content -->
    <div class="content pt-4" (scroll)="onContentScroll($event)">
      <div class="category-heading notranslate">{{formatCategoryName(selectedCategoryDisplay)}}
        <p>{{getCategorySubtitle(selectedCategoryDisplay)}}</p>
      </div>

      <div class="cat-title"><mat-icon>grid_view</mat-icon> Category</div>
      <div class="sub-grid">
        <div class="sub-card all-card-grid" *ngFor="let sub of uniqueSubcategories"
          (click)="onSelectMainCategory(selectedCategory, sub?.name)">
          <img [src]="imageBaseUrl + sub?.image" alt="{{ sub?.name }}" />
          <span class="main-subcategory-title">{{ formatCategory(sub.name) | titlecase }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
