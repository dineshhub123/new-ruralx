<app-loader [isLoading]="isLoading"></app-loader>
<div *ngIf="!isLoading">
  <div class="categories-page pt-3">
    <!-- Sidebar -->
    <div class="sidebar pt-4 mt-1 " (scroll)="onContentScroll($event)">
      <!-- <h3>Categories</h3> -->
      <ul>
        <li #catText *ngFor="let cat of uniqueCategories" class="cat-name"
          (click)="onSelectCategory(cat?.category,catText.innerText)"
          [class.selected]="selectedCategory === cat?.category">
          <label class="category-title" [class.selected]="selectedCategory === cat?.category"> {{ cat?.category |
            titlecase}} </label>
          <ul>
            <li class="sub-card" [class.selected]="selectedCategory === cat?.category">
              <img [src]="'assets/img/' + cat?.category + '-menu.png'" [alt]="cat?.category" class="category-thumb">
            </li>
          </ul>
        </li>
      </ul>
    </div>
    <!-- Main Content -->
    <div class="content pt-4" (scroll)="onContentScroll($event)">
      <div class="category-heading notranslate">{{selectedCategoryDisplay | titlecase}}</div>

      <div class="age-section" *ngIf="selectedCategoryDisplay=='boys' || selectedCategoryDisplay=='girls'">
        <span><mat-icon>man</mat-icon>Age (Years)</span>
        <mat-chip-listbox [(ngModel)]="selectedAge" aria-label="Age Selection">
          <mat-chip-option *ngFor="let age of ageChips" [value]="age.value">
            {{ age.label }}
          </mat-chip-option>
        </mat-chip-listbox>
      </div>
      <div class="age-section" *ngIf="selectedCategoryDisplay=='toddler'">
        <span><mat-icon>child_care</mat-icon> Age (Months)</span>
        <mat-chip-listbox [(ngModel)]="selectedKidsAge" aria-label="KidsAge Selection">
          <mat-chip-option *ngFor="let kids of kidsAgeChips" [value]="kids.value">
            {{ kids.label }}
          </mat-chip-option>
        </mat-chip-listbox>
      </div>

      <div class="cat-title"><mat-icon>grid_view</mat-icon> Category</div>
      <div class="sub-grid">
        <div class="sub-card all-card-grid" *ngFor="let sub of uniqueSubcategories"
          (click)="onSelectMainCategory(sub?.name)">
          <img [src]="imageBaseUrl + sub?.image" alt="{{ sub?.name }}" />
          <span class="main-subcategory-title">{{ formatCategory(sub.name) | titlecase }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
